[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-ai-platform"
version = "0.1.0"
description = "Demo-only TradingAgents research bridge and MetaTrader 5 scalping starter"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ai = ["tradingagents"]

[project.scripts]
trading-ai-gateway = "trading_ai.gateway:main"
trading-ai-research = "trading_ai.research:main"

[tool.setuptools.packages.find]
include = ["trading_ai*"]

[tool.setuptools.package-data]
trading_ai = ["dashboard.html"]
