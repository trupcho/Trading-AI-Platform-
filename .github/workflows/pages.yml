name: Publish Trading AI and verified Windows download
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: trading-ai-pages
  cancel-in-progress: true
jobs:
  build-windows:
    uses: ./.github/workflows/build-browser-v1.1.yml
  build-solana:
    uses: ./.github/workflows/build-solana-paper.yml
  deploy:
    needs: [build-windows, build-solana]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Publish verified Windows download with PWA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p web/downloads
          for attempt in 1 2 3 4; do
            if gh release download browser-v1.0.0 --repo "$GITHUB_REPOSITORY" --pattern 'Trading_AI_Browser_v1.0.exe' --dir web/downloads --clobber; then
              break
            fi
            if [ "$attempt" = 4 ]; then
              echo 'Could not retrieve browser-v1.0.0 asset' >&2
              exit 1
            fi
            sleep 10
          done
          echo "0aece62c9ca83c512f7e864ca09bb5095c89ebe1a66625c2c270db0b38cd516e  web/downloads/Trading_AI_Browser_v1.0.exe" | sha256sum --check
      - name: Publish verified ChatGPT OAuth fix v1.1 download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p web/downloads
          for attempt in 1 2 3 4; do
            if gh release download browser-v1.1.0 --repo "$GITHUB_REPOSITORY" --pattern 'Trading_AI_Browser_v1.1.exe' --dir web/downloads --clobber; then
              break
            fi
            if [ "$attempt" = 4 ]; then
              echo 'Could not retrieve browser-v1.1.0 asset' >&2
              exit 1
            fi
            sleep 10
          done
          echo "b4e09b0d4cfbb41ee634d08f93272adc1d5f92ab43fdb621ee3af9da9a3282cc  web/downloads/Trading_AI_Browser_v1.1.exe" | sha256sum --check
      - name: Download verified Windows build from this run
        uses: actions/download-artifact@v4
        with:
          name: Trading-AI-Browser-v1.1.2-Windows-Portable
          path: web/downloads
      - name: Verify Windows artifact checksum
        working-directory: web/downloads
        run: sha256sum --check Trading_AI_Browser_v1.1.2.exe.sha256
      - name: Download checked Solana PAPER Windows build
        uses: actions/download-artifact@v4
        with:
          name: Trading-AI-Solana-Paper-v0.1-Windows
          path: web/downloads
      - name: Verify Solana PAPER exe against build artifact checksum
        working-directory: web/downloads
        run: sha256sum --check Trading_AI_Solana_Paper_v0.1.exe.sha256
      - name: Upload PWA
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public EXE download byte for byte
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          name=Trading_AI_Browser_v1.1.2.exe
          cd "${RUNNER_TEMP}"
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors --max-time 120             "${PAGE_URL%/}/downloads/$name?build=${GITHUB_RUN_ID}" --output "$name"
          sha256sum --check "$GITHUB_WORKSPACE/web/downloads/$name.sha256"
      - name: Verify public Solana Windows EXE download byte for byte
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          name=Trading_AI_Solana_Paper_v0.1.exe
          cd "${RUNNER_TEMP}"
          curl --fail --silent --show-error --location --retry 6 --retry-all-errors --max-time 120 "${PAGE_URL%/}/downloads/$name?build=${GITHUB_RUN_ID}" --output "$name"
          sha256sum --check "$GITHUB_WORKSPACE/web/downloads/$name.sha256"
