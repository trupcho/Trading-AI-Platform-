name: One-time verified source import
on:
  push:
    paths:
      - '.github/workflows/import.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify source and unpack 20-file project
        run: python .bootstrap/import_bundle.py
      - name: Validate Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Commit imported source; remove temporary importer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Import Trading AI v0.1 complete demo-only source'
          git push origin HEAD:main
